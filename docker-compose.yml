services:
  api-gateway:
    build:
      context: ../api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      BOOKING_SERVICE_URL: http://booking-service:8081
      PAYMENT_SERVICE_URL: http://payment-service:8082
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000,http://localhost:8088
    depends_on:
      - booking-service
      - payment-service

  booking-service:
    build:
      context: ../booking-service
    container_name: booking-service
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://booking-db:5432/booking_db
      SPRING_DATASOURCE_USERNAME: booking_user
      SPRING_DATASOURCE_PASSWORD: booking_pass
      JWT_ISSUER: booking-service
      JWT_SECRET: booking-service-development-secret-key-32
      TICKETING_SERVICE_MOCK_ENABLED: "true"
      PAYMENT_SERVICE_MOCK_ENABLED: "false"
      PAYMENT_SERVICE_URL: http://payment-service:8082
    depends_on:
      - booking-db

  payment-service:
    build:
      context: ../payment-service
    container_name: payment-service
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://payment-db:5432/payment_db
      SPRING_DATASOURCE_USERNAME: payment_user
      SPRING_DATASOURCE_PASSWORD: payment_pass
      JWT_ISSUER: payment-service
      JWT_SECRET: payment-service-development-secret-key-32
      BOOKING_SERVICE_MOCK_ENABLED: "true"
      BOOKING_SERVICE_URL: http://booking-service:8081
    depends_on:
      - payment-db

  frontend:
    build:
      context: ../frontend
    container_name: event-ticketing-frontend
    ports:
      - "8088:80"
    depends_on:
      - api-gateway

  booking-db:
    image: postgres:16
    container_name: booking-db
    environment:
      POSTGRES_DB: booking_db
      POSTGRES_USER: booking_user
      POSTGRES_PASSWORD: booking_pass
    ports:
      - "5433:5432"
    volumes:
      - booking-db-data:/var/lib/postgresql/data

  payment-db:
    image: postgres:16
    container_name: payment-db
    environment:
      POSTGRES_DB: payment_db
      POSTGRES_USER: payment_user
      POSTGRES_PASSWORD: payment_pass
    ports:
      - "5434:5432"
    volumes:
      - payment-db-data:/var/lib/postgresql/data

volumes:
  booking-db-data:
  payment-db-data:
