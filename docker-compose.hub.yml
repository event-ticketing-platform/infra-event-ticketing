services:
  api-gateway:
    image: ${DOCKERHUB_NAMESPACE:-parvesshikder}/event-ticketing-api-gateway:${IMAGE_TAG:-latest}
    container_name: api-gateway
    ports:
      - "${API_GATEWAY_HOST_PORT:-18080}:8080"
    environment:
      BOOKING_SERVICE_URL: http://booking-service:8081
      PAYMENT_SERVICE_URL: http://payment-service:8082
      EVENT_SERVICE_URL: ${EVENT_SERVICE_URL:-http://event-service:8083}
      TICKETING_SERVICE_URL: ${TICKETING_SERVICE_URL:-http://booking-service:8081}
      VENUE_SERVICE_URL: ${VENUE_SERVICE_URL:-http://venue-service:8084}
      USER_SERVICE_URL: ${USER_SERVICE_URL:-http://user-service:8090}
      CHECKIN_SERVICE_URL: ${CHECKIN_SERVICE_URL:-http://checkin-service:8087}
      REPORTING_SERVICE_URL: ${REPORTING_SERVICE_URL:-http://reporting-service:8089}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000,http://localhost:8088}
      JWT_ISSUER: ${JWT_ISSUER:-event-ticketing-gateway}
      JWT_SECRET: ${JWT_SECRET:-event-ticketing-development-secret-32}
      JWT_TTL_MINUTES: ${JWT_TTL_MINUTES:-120}
      SPRING_R2DBC_URL: r2dbc:postgresql://auth-db:5432/auth_db
      SPRING_R2DBC_USERNAME: auth_user
      SPRING_R2DBC_PASSWORD: auth_pass
      AUTH_BOOTSTRAP_ADMIN_USERNAME: ${AUTH_BOOTSTRAP_ADMIN_USERNAME:-admin}
      AUTH_BOOTSTRAP_ADMIN_EMAIL: ${AUTH_BOOTSTRAP_ADMIN_EMAIL:-admin@event-ticketing.local}
      AUTH_BOOTSTRAP_ADMIN_PASSWORD: ${AUTH_BOOTSTRAP_ADMIN_PASSWORD:-admin123}
    depends_on:
      - auth-db
      - booking-service
      - event-service
      - payment-service
      - user-service

  booking-service:
    image: ${DOCKERHUB_NAMESPACE:-parvesshikder}/event-ticketing-booking-service:${IMAGE_TAG:-latest}
    container_name: booking-service
    ports:
      - "${BOOKING_SERVICE_HOST_PORT:-18081}:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://booking-db:5432/booking_db
      SPRING_DATASOURCE_USERNAME: booking_user
      SPRING_DATASOURCE_PASSWORD: booking_pass
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
      JWT_ISSUER: ${JWT_ISSUER:-event-ticketing-gateway}
      JWT_SECRET: ${JWT_SECRET:-event-ticketing-development-secret-32}
      PAYMENT_SERVICE_URL: http://payment-service:8082
    depends_on:
      - booking-db
      - rabbitmq

  payment-service:
    image: ${DOCKERHUB_NAMESPACE:-parvesshikder}/event-ticketing-payment-service:${IMAGE_TAG:-latest}
    container_name: payment-service
    ports:
      - "${PAYMENT_SERVICE_HOST_PORT:-18082}:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://payment-db:5432/payment_db
      SPRING_DATASOURCE_USERNAME: payment_user
      SPRING_DATASOURCE_PASSWORD: payment_pass
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
      JWT_ISSUER: ${JWT_ISSUER:-event-ticketing-gateway}
      JWT_SECRET: ${JWT_SECRET:-event-ticketing-development-secret-32}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    depends_on:
      - payment-db
      - rabbitmq

  event-service:
    image: deb0tush/event-service:${TEAM_IMAGE_TAG:-latest}
    platform: linux/amd64
    container_name: event-service
    ports:
      - "${EVENT_SERVICE_HOST_PORT:-18083}:8083"
    environment:
      SERVER_PORT: 8083

  user-service:
    image: deb0tush/user-service:${TEAM_IMAGE_TAG:-latest}
    platform: linux/amd64
    container_name: user-service
    ports:
      - "${USER_SERVICE_HOST_PORT:-18085}:8090"
    environment:
      SERVER_PORT: 8090
      SPRING_DATASOURCE_URL: jdbc:postgresql://user-db:5432/user_service_db
      SPRING_DATASOURCE_USERNAME: user_user
      SPRING_DATASOURCE_PASSWORD: user_pass
      JWT_SECRET: ${JWT_SECRET:-event-ticketing-development-secret-32}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
    depends_on:
      - user-db

  frontend:
    image: ${DOCKERHUB_NAMESPACE:-parvesshikder}/event-ticketing-frontend:${IMAGE_TAG:-latest}
    container_name: event-ticketing-frontend
    ports:
      - "${FRONTEND_HOST_PORT:-8088}:80"
    depends_on:
      - api-gateway

  booking-db:
    image: postgres:16
    container_name: booking-db
    environment:
      POSTGRES_DB: booking_db
      POSTGRES_USER: booking_user
      POSTGRES_PASSWORD: booking_pass
    ports:
      - "${BOOKING_DB_HOST_PORT:-5433}:5432"
    volumes:
      - booking-db-data:/var/lib/postgresql/data

  auth-db:
    image: postgres:16
    container_name: auth-db
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_pass
    ports:
      - "${AUTH_DB_HOST_PORT:-5435}:5432"
    volumes:
      - auth-db-data:/var/lib/postgresql/data

  user-db:
    image: postgres:16
    container_name: user-db
    environment:
      POSTGRES_DB: user_service_db
      POSTGRES_USER: user_user
      POSTGRES_PASSWORD: user_pass
    ports:
      - "${USER_DB_HOST_PORT:-5438}:5432"
    volumes:
      - user-db-data:/var/lib/postgresql/data

  payment-db:
    image: postgres:16
    container_name: payment-db
    environment:
      POSTGRES_DB: payment_db
      POSTGRES_USER: payment_user
      POSTGRES_PASSWORD: payment_pass
    ports:
      - "${PAYMENT_DB_HOST_PORT:-5434}:5432"
    volumes:
      - payment-db-data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: event-ticketing-rabbitmq
    ports:
      - "${RABBITMQ_HOST_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_HOST_PORT:-15672}:15672"

volumes:
  auth-db-data:
  booking-db-data:
  payment-db-data:
  user-db-data:
